<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Contactos | Cybersecurity & Data</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-image">

    <nav class="navbar navbar-expand-lg navbar-dark glass-navbar mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-shield-lock me-2"></i>Agenda Profesional
            </a>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">
        <div class="glass-panel p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                <h2 class="m-0 text-white"><i class="bi bi-people me-2"></i>Gestión de Contactos</h2>
                <button class="btn btn-cyan btn-add shadow" data-bs-toggle="modal" data-bs-target="#contactoModal" id="btnNuevoContacto">
                    <i class="bi bi-plus-lg me-1"></i> Agregar Contacto
                </button>
            </div>

            <div class="table-responsive">
                <table class="table glass-table align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre Completo</th>
                            <th>Fecha Nacimiento</th>
                            <th>Categoría</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaContactosBody">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="text-white text-center py-3 mt-auto glass-footer">
        <div class="container">
            <p class="mb-0 small">Desarrollado con <i class="bi bi-code-slash text-info"></i> por Ivan Reyes | Cybersecurity & Data Analyst</p>
        </div>
    </footer>

    <div class="modal fade" id="contactoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content glass-modal text-white">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title" id="modalTitle">Nuevo Contacto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formContacto">
                        <input type="hidden" id="idContacto">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="nombre" class="form-label text-light">Nombre</label>
                                <input type="text" class="form-control glass-input" id="nombre" required>
                            </div>
                            <div class="col-md-6">
                                <label for="apellido" class="form-label text-light">Apellido</label>
                                <input type="text" class="form-control glass-input" id="apellido" required>
                            </div>
                            <div class="col-md-6">
                                <label for="fechaNacimiento" class="form-label text-light">Nacimiento</label>
                                <input type="date" class="form-control glass-input" id="fechaNacimiento" required>
                            </div>
                            <div class="col-md-6">
                                <label for="idCategoria" class="form-label text-light">ID Categoría</label>
                                <input type="number" class="form-control glass-input" id="idCategoria" required>
                            </div>
                        </div>
                        <div id="camposExtraCreacion" class="row g-3 mt-1">
                            <div class="col-md-6">
                                <label for="telefono" class="form-label text-light">Teléfono</label>
                                <input type="text" class="form-control glass-input" id="telefono">
                            </div>
                            <div class="col-md-6">
                                <label for="correo" class="form-label text-light">Correo</label>
                                <input type="email" class="form-control glass-input" id="correo">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-cyan" id="btnGuardar">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm">
            <div class="modal-content glass-modal text-white">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title">Confirmar</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <i class="bi bi-shield-exclamation text-warning fs-1 d-block mb-3"></i>
                    <p>¿Eliminar este registro de forma permanente?</p>
                </div>
                <div class="modal-footer justify-content-center border-top border-secondary">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmDelete">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module" src="js/app.js"></script>
</body>
</html>
